name: Build LP cases (static injection)

on:
  schedule:
    # 毎日 18:15 UTC = 翌03:15 JST。2026-11-07 に週1（日曜）から毎日へ。WP の「サイトの表示 → ビズマンガ → 用途別 LP」で
    # 事例を選べるようにしたため、翌朝には LP に出るようにした（中身が変わらない日はコミットしない）
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

# All jobs writing generated content serialize checkout/build/push.
concurrency:
  group: bizmanga-generated-content
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the branch tip after waiting for the other generators.
          ref: ${{ github.ref_name }}
      # js/bm-wp-config.js の maintenance: true の間は WordPress から取り込まない（SPEC.md「WordPress 一時停止スイッチ」）
      - name: Skip while WordPress maintenance is on
        id: gate
        run: |
          if grep -Eq '^[[:space:]]*maintenance:[[:space:]]*true' js/bm-wp-config.js; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::WordPress メンテナンス中のため、ビルドを止めました"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.skip != 'true'
        run: python3 tools/build-lp-cases.py
      - name: Commit generated files
        if: steps.gate.outputs.skip != 'true'
        run: >-
          python tools/commit-generated.py
          --message "chore(lp-cases): auto-inject static cases from WP [skip ci]"
          product-manga.html recruit-manga.html manga-ad-lp.html company-manga.html sales-manga.html training-manga.html inbound-manga.html ir-manga.html
